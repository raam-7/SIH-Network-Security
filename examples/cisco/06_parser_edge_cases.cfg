banner login ^
AUTHORIZED USERS ONLY
All access is monitored.
Unauthorized access is prohibited.
^

!
! ----- Another section after multiline command -----
line console 0
 exec-timeout 5 0
 logging synchronous

!
! ----- Repeated section -----
line vty 0 4
 transport input ssh
 exit

