hostname PARSER-EDGE-01

!
! ----- Repeated global commands -----
ip name-server 192.0.2.53
ip name-server 198.51.100.53

!
! ----- SSH configuration -----
ip ssh version 2
!
ip ssh time-out 60

!
! ----- Explicit negative commands -----
no ip http server
no cdp run
no ip source-route

!
! ----- Interface context -----
interface GigabitEthernet0/0
 description EDGE-UPLINK
 ip address 192.0.2.20 255.255.255.0
 no ip redirects
 no shutdown
 exit

!
! ----- Second interface immediately after exit -----
interface GigabitEthernet0/1
 description INTERNAL-UPLINK
 ip address 198.51.100.20 255.255.255.0
 no ip proxy-arp
 no shutdown

!
