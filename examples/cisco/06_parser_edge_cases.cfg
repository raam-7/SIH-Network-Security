router bgp 65001
 bgp router-id 203.0.113.20
 neighbor 192.0.2.21 remote-as 65002
 address-family ipv4
  network 198.51.100.0 mask 255.255.255.0
  neighbor 192.0.2.21 activate
 exit-address-family
 exit

!
! ----- VTY context -----
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
 exit

