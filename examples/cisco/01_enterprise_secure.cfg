!
! ============================================================
! Sanitized Cisco IOS-XE Enterprise Router Fixture
! Synthetic test data for SIH Network Security Compliance Auditor
! ============================================================
!
version 17.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname EDGE-RTR-01
!
no ip domain-lookup
ip domain name example.net
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
aaa accounting exec default start-stop
!
username netadmin privilege 15 secret <REDACTED>
username auditor privilege 5 secret <REDACTED>
!
enable secret <REDACTED>
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
crypto key generate rsa general-keys modulus 2048
!
logging buffered 16384 informational
logging host 192.0.2.50
logging trap warnings
!
ntp server 192.0.2.123
ntp server 198.51.100.123
!
interface GigabitEthernet0/0
 description WAN-UPLINK
 ip address 192.0.2.1 255.255.255.252
 no ip redirects
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/1
 description INTERNAL-LAN
 ip address 198.51.100.1 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no shutdown
!
interface Loopback0
 description MANAGEMENT-LOOPBACK
 ip address 203.0.113.10 255.255.255.255
!
ip access-list extended VTY-MGMT
 remark Restrict management access
 permit tcp 198.51.100.0 0.0.0.255 any eq 22
 deny ip any any log
!
line console 0
 exec-timeout 5 0
 login authentication default
 logging synchronous
!
line aux 0
 exec-timeout 5 0
 transport input none
!
line vty 0 4
 exec-timeout 10 0
 login authentication default
 transport input ssh
 access-class VTY-MGMT in
!
line vty 5 15
 exec-timeout 10 0
 login authentication default
 transport input ssh
 access-class VTY-MGMT in
!
no ip http server
ip http secure-server
!
no cdp run
!
end
