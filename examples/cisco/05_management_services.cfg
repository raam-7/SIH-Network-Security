!
! ============================================================
! Cisco IOS-XE Management Services and Hardening Fixture
! Synthetic sanitized test data
! ============================================================
!
hostname MGMT-SERVICES-RTR
!
ip domain name example.net
!
ip name-server 192.0.2.53
ip name-server 198.51.100.53
!
ip ssh version 2
ip ssh time-out 30
ip ssh authentication-retries 2
!
no ip http server
ip http secure-server
ip http authentication local
!
no service tcp-small-servers
no service udp-small-servers
no ip finger
no ip source-route
no cdp run
!
service timestamps debug datetime msec
service timestamps log datetime msec
!
logging buffered 32768 informational
logging host 192.0.2.50
logging host 198.51.100.50
logging trap informational
!
ntp server 192.0.2.123
ntp authenticate
ntp authentication-key 10 md5 <REDACTED>
ntp trusted-key 10
!
banner login ^
AUTHORIZED ACCESS ONLY
This system is monitored.
^
!
banner motd ^
Corporate Network Device
^
!
interface GigabitEthernet0/0
 description MANAGEMENT-UPLINK
 ip address 192.0.2.10 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no ip unreachables
 no shutdown
!
line console 0
 exec-timeout 5 0
 logging synchronous
!
line vty 0 4
 exec-timeout 10 0
 login local
 transport input ssh
!
line vty 5 15
 exec-timeout 10 0
 login local
 transport input ssh
!
end
