hostname CORE-RTR-01
!
interface GigabitEthernet0/0
 description PRIMARY-WAN
 ip address 192.0.2.1 255.255.255.252
 ip access-group WAN-IN in
 ip access-group WAN-OUT out
 no ip redirects
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/1
 description INTERNAL-NETWORK
 ip address 198.51.100.1 255.255.255.0
 ip access-group LAN-IN in
 no ip redirects
 no ip proxy-arp
 no shutdown
!
interface Loopback0
 description ROUTER-ID
 ip address 203.0.113.1 255.255.255.255
!
ip access-list extended WAN-IN
 remark Allow established traffic
 permit tcp any any established
 permit icmp any any echo-reply
 deny ip any any log
!
ip access-list extended WAN-OUT
 permit ip 198.51.100.0 0.0.0.255 any
 deny ip any any log
!
ip access-list extended LAN-IN
 permit tcp 198.51.100.0 0.0.0.255 any eq 22
 permit udp 198.51.100.0 0.0.0.255 any eq 123
 deny ip any any log
!
router ospf 10
 router-id 203.0.113.1
 passive-interface default
 no passive-interface GigabitEthernet0/0
 network 198.51.100.0 0.0.0.255 area 0
 network 203.0.113.1 0.0.0.0 area 0
!
router bgp 65001
 bgp router-id 203.0.113.1
 neighbor 192.0.2.2 remote-as 65002
 address-family ipv4
  network 198.51.100.0 mask 255.255.255.0
  neighbor 192.0.2.2 activate
 exit-address-family
!
ip route 203.0.113.0 255.255.255.0 192.0.2.2
!
end
